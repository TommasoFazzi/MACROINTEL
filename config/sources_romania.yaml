# Romania Vertical PoC — Source Registry
# Source of truth for 26 Romania/CEE intelligence sources.
# Loaded by scripts/seed_sources.py → populates intelligence_sources table.
#
# RSS availability verified 2026-05-07 (⚠️ = needs periodic re-check):
#   has_rss: true  → feed_names populated, included in config/feeds.yaml
#   has_rss: false → PDF/HTML ingestion only (ingest_pdfs.py or manual)
#
# retrieval_profile:
#   always       → fetched daily without condition
#   event-driven → fetched when relevant event detected (institutional releases)
#   research     → long-form, 14-day lookback window preferred

