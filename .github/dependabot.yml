version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Rome"
    open-pull-requests-limit: 5
    ignore:
      # Blocked by openbb-core==1.6.9 version cap — do not auto-bump
      - dependency-name: "fastapi"
      - dependency-name: "starlette"
      - dependency-name: "python-multipart"
      # openbb-* plugins: any version bump beyond current pins requires
      # openbb-core>=1.6.10 which pulls fastapi==0.136 — incompatible with our stack
      - dependency-name: "openbb"
      - dependency-name: "openbb-*"
      # sentence-transformers 5.x accepts transformers<6: minor/patch bumps are fine
      - dependency-name: "transformers"
        update-types: ["version-update:semver-major"]
      # No ARM64 wheel guarantee — bump manually after verification
      - dependency-name: "torch"

  - package-ecosystem: "npm"
    directory: "/web-platform"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Rome"
    open-pull-requests-limit: 5
    ignore:
      # Major version bumps — require manual testing of the frontend
      - dependency-name: "lucide-react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "shadcn"
        update-types: ["version-update:semver-major"]
