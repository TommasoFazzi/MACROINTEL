name: Daily Intelligence Pipeline

on:
  workflow_dispatch: # triggered by Hetzner cron at 07:00 UTC (09:00 CEST)
    inputs:
      from_time:
        description: "Report article window start (ISO YYYY-MM-DDTHH:MM). Empty = default last-N-days behavior."
        required: false
        default: ""
      to_time:
        description: "Report article window end (ISO YYYY-MM-DDTHH:MM). Empty = default last-N-days behavior."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # 6 ore max (il NLP da solo può durare 90+ minuti)

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Cache HuggingFace models
        uses: actions/cache@v4
        id: cache-hf
        with:
          path: ~/.cache/huggingface/hub
          key: hf-models-v1
          restore-keys: hf-models-

      - name: Cache Patchright Chromium
        uses: actions/cache@v4
        id: cache-chromium
        with:
          path: ~/.cache/ms-playwright
          key: patchright-chromium-v1-${{ runner.os }}

      - name: Install dependencies
        run: |
          pip install -r requirements-prod.txt
          python -m spacy download xx_ent_wiki_sm

      - name: Install Patchright Chromium
        if: steps.cache-chromium.outputs.cache-hit != 'true'
        run: python -m patchright install chromium

      - name: Download sentence-transformers models
        # Only on cold cache. When cache is warm we skip this entirely and load
        # offline (see HF_HUB_OFFLINE in the pipeline step) — transformers otherwise
        # phones home to /api/models on every from_pretrained and can 429 even cached.
        if: steps.cache-hf.outputs.cache-hit != 'true'
        env:
          # Authenticated requests have much higher HF Hub rate limits than anonymous.
          # Optional: pipeline still works without it, but anonymous downloads risk 429.
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # Retry with exponential backoff: HF Hub returns transient 429s on shared CI IPs.
          for attempt in 1 2 3 4 5; do
            if python -c "from sentence_transformers import SentenceTransformer, CrossEncoder; SentenceTransformer('paraphrase-multilingual-MiniLM-L12-v2'); CrossEncoder('cross-encoder/ms-marco-MiniLM-L-6-v2')"; then
              echo "Models ready (attempt $attempt)"
              exit 0
            fi
            delay=$((10 * 2 ** (attempt - 1)))
            echo "HF download failed (attempt $attempt). Retrying in ${delay}s..."
            sleep "$delay"
          done
          echo "ERROR: HF model download failed after 5 attempts"
          exit 1

      - name: Setup SSH tunnel to Hetzner DB
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.VPS_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts
          # Installa autossh per tunnel persistente (si riconnette se cade)
          sudo apt-get install -y -q autossh
          # Tunnel persistente: runner:5432 → Hetzner 127.0.0.1:5432
          AUTOSSH_GATETIME=0 autossh -M 0 -fN \
            -o ExitOnForwardFailure=yes \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3 \
            -o StrictHostKeyChecking=yes \
            -L 5432:127.0.0.1:5432 \
            deploy@${{ secrets.VPS_HOST }}
          sleep 5
          # Verifica esplicita che il tunnel sia attivo
          nc -z 127.0.0.1 5432 || (echo "ERROR: SSH tunnel failed - postgres unreachable on 127.0.0.1:5432" && exit 1)
          echo "SSH tunnel OK - postgres reachable on 127.0.0.1:5432"

      - name: Run pipeline
        env:
          DATABASE_URL: postgresql://${{ secrets.POSTGRES_USER }}:${{ secrets.POSTGRES_PASSWORD }}@127.0.0.1:5432/intelligence_ita
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          PYTHONPATH: ${{ github.workspace }}
          # Models are already cached/downloaded above. Force fully-offline HF loads so
          # transformers never calls /api/models (model_info) — that call 429s on shared
          # CI IPs even when files are cached, and would kill the long pipeline run.
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          REPORT_OUTPUT_DIR: ./reports
          DATA_DIR: ./data
          ENVIRONMENT: production
          PIPELINE_NOTIFY_ON_SUCCESS: "false"
          PIPELINE_NOTIFY_ON_FAILURE: "false"
          BREVO_SMTP_USER: ${{ secrets.BREVO_SMTP_USER }}
          BREVO_SMTP_PASS: ${{ secrets.BREVO_SMTP_PASS }}
          BREVO_FROM_EMAIL: ${{ secrets.BREVO_FROM_EMAIL }}
          BREVO_FROM_NAME: ${{ secrets.BREVO_FROM_NAME }}
          # Optional report article time-window (anchors news to the 09:00 report
          # window so news + macro stay coherent on a late/recovery re-run).
          REPORT_FROM_TIME: ${{ github.event.inputs.from_time }}
          REPORT_TO_TIME: ${{ github.event.inputs.to_time }}
        run: |
          mkdir -p logs reports data
          python scripts/daily_pipeline.py

      - name: Upload logs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-logs-${{ github.run_id }}
          path: logs/
          retention-days: 30
