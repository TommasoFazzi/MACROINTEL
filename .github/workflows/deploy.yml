name: Deploy to Production

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - 'requirements.txt'
      - 'requirements-prod.txt'
      - 'Dockerfile'
  workflow_dispatch:

# One run per ref at a time. On main this serialises deploys: two merges in a row used to
# start two parallel builds on the same server. Queued, never cancelled — a deploy killed
# mid `docker compose up` is worse than a late one. (GitHub keeps only the newest pending
# run per group; fine, since every deploy pulls main's HEAD anyway.)
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m spacy download xx_ent_wiki_sm

      - name: Run tests
        env:
          GEMINI_API_KEY: "ci-fake-key-for-unit-tests"
          ANTHROPIC_API_KEY: "ci-fake-key-for-unit-tests"
          DEEPSEEK_API_KEY: "ci-fake-key-for-unit-tests"
          MISTRAL_API_KEY: "ci-fake-key-for-unit-tests"
        run: pytest tests/ -m "not slow" --ignore=tests/test_sprint2_full.py --tb=short -q

  arm64-build-check:
    # Pre-merge guard for Hetzner CAX31 (linux/arm64). Catches missing wheels or
    # native build failures before they hit main. Runs only on PRs that touch
    # requirements files or the Dockerfile (paths filter at workflow level).
    name: ARM64 build & import check (Hetzner CAX31)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ARM64 image (load to local daemon)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64
          push: false
          load: true
          cache-from: type=gha,scope=arm64-deps
          cache-to: type=gha,scope=arm64-deps,mode=max
          tags: intelligence-ita:arm64-check

      - name: Verify critical imports under arm64
        run: |
          docker run --rm --platform linux/arm64 \
            --entrypoint python \
            intelligence-ita:arm64-check \
            -c "import leidenalg, igraph, unidecode; from scipy.optimize import linear_sum_assignment; from sentence_transformers import SentenceTransformer; print('arm64 critical imports OK')"

      - name: Verify CPU-only torch (no CUDA wheels in the image)
        run: |
          docker run --rm --platform linux/arm64 --entrypoint sh intelligence-ita:arm64-check -c '
            python -c "import torch; v=torch.__version__; print(\"torch\", v); assert v.endswith(\"+cpu\"), v"
            if pip list 2>/dev/null | grep -iE "^(nvidia-|cuda-|triton )"; then echo "CUDA packages found in image"; exit 1; fi
            echo "no CUDA packages"'

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          known_hosts: ${{ secrets.VPS_KNOWN_HOSTS }}
          command_timeout: 30m
          script: |
            # appleboy/ssh-action does NOT set -e by default: without this, a failed
            # build or `up -d` lets the script continue to the final `echo` and the
            # workflow exits 0 while the site is down. See the 2026-09-12 incident,
            # where the frontend container was never recreated and prune deleted the
            # evidence, yet the deploy reported success for two days.
            set -euo pipefail

            cd /opt/intelligence-ita/repo
            # Always deploy main, fast-forward only. A bare `git pull origin main` merged
            # main into whatever branch was checked out: from 2026-09-07 the server sat on
            # a local feature branch and every deploy died on "divergent branches" for 4 weeks.
            git fetch origin main
            git checkout main
            git merge --ff-only origin/main
            DEPLOY_SHA=$(git rev-parse --short HEAD)

            # Prune BEFORE building. Running it afterwards deletes the very container
            # that just failed to start, destroying the only evidence of the failure.
            sudo docker container prune -f

            sudo docker compose -p app --env-file .env.production build backend
            sudo docker compose -p app --env-file .env.production build \
              --build-arg DEPLOY_SHA=$DEPLOY_SHA \
              frontend
            sudo docker compose -p app --env-file .env.production up -d --no-deps backend frontend
            sudo docker compose -p app --env-file .env.production exec -T nginx nginx -s reload

            # Assert the success path. Every nginx location proxies to frontend:3000,
            # so a dead frontend is a site-wide 502 that every other check still
            # reports as healthy. Retry to absorb container start-up time.
            for i in $(seq 1 12); do
              code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 https://macrointel.net/ || echo 000)
              if [ "$code" = "200" ]; then
                echo "Smoke test OK (HTTP $code) after ${i} attempt(s)"
                break
              fi
              if [ "$i" = "12" ]; then
                echo "Smoke test FAILED: https://macrointel.net/ returned $code"
                sudo docker compose -p app ps -a || true
                sudo docker compose -p app logs --tail=50 frontend || true
                exit 1
              fi
              sleep 5
            done

            chmod +x deploy/trigger_pipeline.sh
            echo "Deploy completed at $(date)"
