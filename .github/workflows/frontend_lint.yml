name: Frontend Lint

# ESLint + TypeScript typecheck for web-platform. Lint was silently broken from
# 2026-06-29 to 2026-10-04 because nothing ran it; this keeps it at zero.

on:
  pull_request:
    paths:
      - 'web-platform/**'
      - '.github/workflows/frontend_lint.yml'
  push:
    branches: [main]
    paths:
      - 'web-platform/**'

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web-platform

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web-platform/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: ESLint
        run: npm run lint

      - name: Typecheck (TypeScript 7 via @typescript/native)
        run: npx tsc --noEmit
